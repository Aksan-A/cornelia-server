services:
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest

    user: "${PUID:-1000}:${PGID:-1000}"

    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"

    environment:
      TZ: "Europe/Amsterdam"

    volumes:
      - ../../data/jellyfin/config:/config
      - ../../data/jellyfin/cache:/cache
      - ../../data/media:/media:ro

    restart: unless-stopped

